/* 가로로 넓은 패드(너비≥900·높이≥500): 큰 경기 화면 + 오른쪽 컨트롤 칸(#side: 패드·안내·행동 버튼). 휴대폰·세로 화면은 기존 배치 그대로 */

 return awSpark(awSpark(awSpark(awSpark(rows,2,5,2),27,3,1),26,18,1),3,21,1)}
